

#TWO STAGE TRAINING
label_split: [4, 4]
purpose: test
sequence_size: 125
optimizer: adam
lr: 0.0001
model: textar
loss_fn:
  train: train_loss
  val: val_loss
loss_weights:
  - 0.25
  - 0.75
loss_types:
  train: [train_wce,train_wce]
  val: [train_wce,train_wce]
datasets:
  train: folder/train/WORD_CW
  val: folder/val/WORD_CW
  inf: folder/inf/WORD_CW
bounding_box_label_jsons:
  train: folder/train/bbox.json
  val: folder/val/bbox.json
  inf: folder/inf/bbox.json

batch_size: 1600
pretrained: /content/tex-tar/folder/TexTAR-trained.pt
pretrained_function: false
accumulated_batch_descent: 2
dataloader:
  train: DocLevelDataset_RoPE_Train
  val: DocLevelDataset_RoPE_Val_name

num_workers: 8
use_wandb: false
run_name: test-run-1-textar-test-over-best-consent-mixed
shuffle: true
wandb_project_name: T1-9Aug
epochs: 200
checkpoint_dir: /content/tex-tar/folder/weights
